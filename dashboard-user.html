<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #18181b;
            --sidebar-bg: #18181b;
            --text: #18181b;
            --muted: #71717a;
            --border: #e4e4e7;
            --bg: #fafafa;
        }

        body { font-family: 'Instrument Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; color: var(--text); }

        /* Sidebar */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .sidebar-top {
            padding: 24px 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .app-name {
            font-family: 'Instrument Serif', serif;
            font-size: 18px;
            color: white;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .sidebar-section { padding: 16px 8px 0; }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            color: #52525b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 8px;
            margin-bottom: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: #a1a1aa;
            font-size: 13px;
            font-weight: 400;
            transition: background 0.12s, color 0.12s;
            margin-bottom: 1px;
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); color: #e4e4e7; }
        .nav-item.active { background: rgba(255,255,255,0.08); color: white; font-weight: 500; }
        .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #3f3f46;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }

        .user-info-text .user-name { font-size: 13px; font-weight: 500; color: white; }
        .user-info-text .user-role { font-size: 11px; color: #52525b; }

        .btn-logout {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: #71717a;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Instrument Sans', sans-serif;
            cursor: pointer;
            transition: all 0.12s;
        }

        .btn-logout:hover { background: rgba(255,255,255,0.05); color: #a1a1aa; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .topbar {
            background: white;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 { font-size: 15px; font-weight: 600; color: var(--text); }
        .topbar-date { font-size: 12px; color: var(--muted); }

        .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

        /* Banner */
        .banner {
            background: var(--accent);
            border-radius: 12px;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .banner h3 { font-size: 18px; font-weight: 600; color: white; margin-bottom: 4px; }
        .banner p { font-size: 13px; color: #a1a1aa; }

        .banner-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* Quick actions */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
        }

        .action-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); transform: translateY(-1px); }

        .action-icon {
            width: 36px;
            height: 36px;
            background: #f4f4f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .action-icon svg { width: 18px; height: 18px; color: var(--text); }
        .action-label { font-size: 12px; font-weight: 500; color: var(--text); }

        /* Panels */
        .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .panel-head {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-head h4 { font-size: 13px; font-weight: 600; color: var(--text); }
        .panel-head a { font-size: 12px; color: var(--muted); text-decoration: none; font-weight: 500; }
        .panel-head a:hover { color: var(--text); }

        .empty-panel { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 13px; }
        .empty-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.4; }

        @media (max-width: 1024px) {
            .actions-grid { grid-template-columns: repeat(2, 1fr); }
            .panels { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-top">
        <div class="app-name">Dashboard</div>
    </div>

    <div class="sidebar-section">
        <div class="section-label">Menu</div>
        <div class="nav-item active">
            <svg fill="none" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>
            Home
        </div>
        <div class="nav-item">
            <svg fill="none" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 2.5V1M11.5 2.5V1M1.5 6.5h13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Events
        </div>
        <div class="nav-item">
            <svg fill="none" viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Documents
        </div>
        <div class="nav-item">
            <svg fill="none" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M8 2v1M8 13v1M2 8h1M13 8h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Settings
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="user-row">
            <div class="avatar" id="userAvatar">?</div>
            <div class="user-info-text">
                <div class="user-name" id="userName">Loading…</div>
                <div class="user-role">User</div>
            </div>
        </div>
        <button class="btn-logout" onclick="Auth.logout()">Sign out</button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <h2>Dashboard</h2>
        <div class="topbar-date" id="topDate"></div>
    </div>

    <div class="content">
        <div class="banner">
            <div>
                <h3>Welcome, <span id="welcomeName">—</span></h3>
                <p>Here's your overview for today.</p>
            </div>
            <div class="banner-badge">User</div>
        </div>

        <div class="actions-grid">
            <div class="action-card">
                <div class="action-icon">
                    <svg fill="none" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </div>
                <div class="action-label">New Item</div>
            </div>
            <div class="action-card">
                <div class="action-icon">
                    <svg fill="none" viewBox="0 0 20 20"><path d="M4 6h12M4 10h8M4 14h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </div>
                <div class="action-label">Reports</div>
            </div>
            <div class="action-card">
                <div class="action-icon">
                    <svg fill="none" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 4V2M13 4V2M3 8h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </div>
                <div class="action-label">Schedule</div>
            </div>
            <div class="action-card">
                <div class="action-icon">
                    <svg fill="none" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </div>
                <div class="action-label">Profile</div>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-head">
                    <h4>Recent Activity</h4>
                    <a href="#">View all</a>
                </div>
                <div class="empty-panel">
                    <div class="empty-icon">📋</div>
                    No recent activity yet.
                </div>
            </div>
            <div class="panel">
                <div class="panel-head">
                    <h4>Tasks</h4>
                    <a href="#">View all</a>
                </div>
                <div class="empty-panel">
                    <div class="empty-icon">✅</div>
                    You're all caught up!
                </div>
            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    const session = Auth.requireAuth(['user']);
    if (session) {
        document.getElementById('userName').textContent = session.name;
        document.getElementById('welcomeName').textContent = session.name.split(' ')[0];
        document.getElementById('userAvatar').textContent = session.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        document.getElementById('topDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
</script>
</body>
</html>
